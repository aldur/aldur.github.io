name: nix flake check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master

  schedule:
    - cron: "0 0 * * MON"

permissions:
  contents: read

# Cancel existing executions when new commits are pushed onto the branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: 
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          # Authenticate GitHub API calls (Nix install + fetching flake inputs) to avoid rate limits
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L
      # This needs to run outside of nix checks because it downloads new packages (gems)
      - run: nix run '.#lock'
      - run: git diff gemset.nix  # Exit 1 if this changed
