name: Install Nix
description: >-
  Install Nix, authenticating GitHub API calls (installer download and flake
  input fetches) with the job token to avoid anonymous rate limits.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ github.token }}
